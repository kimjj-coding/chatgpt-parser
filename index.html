<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNDERFAIL</title>
  </head>
  <body>
    <div id="game"></div>
    <button id="underfail-reset" type="button" aria-label="게임 처음부터 다시 시작">
      처음부터 초기화
    </button>
    <script>
      const resetButton = document.getElementById('underfail-reset');
      resetButton?.addEventListener('click', () => {
        localStorage.removeItem('underfail-save-v1');
        location.reload();
      });
      window.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() === 'r' && !event.repeat) {
          localStorage.removeItem('underfail-save-v1');
          location.reload();
        }
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background: #10131c;
      }

      #game {
        position: relative;
        z-index: 1;
      }

      #underfail-reset {
        position: fixed;
        z-index: 20;
        top: 10px;
        right: 12px;
        height: 36px;
        padding: 0 14px;
        border: 2px solid #fca5a5;
        border-radius: 4px;
        background: #7f1d1d;
        color: #fff1f2;
        font-family: monospace;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      #underfail-reset:hover {
        background: #991b1b;
      }

      #underfail-reset:focus-visible {
        outline: 3px solid #fde68a;
        outline-offset: 2px;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
